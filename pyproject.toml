[project]
name = "mobility"
version = "0.1.0"
description = "Limits of predictability in human mobility: GeoLife + H3 reproduction and route suggestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "h3>=4.1",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "folium>=0.17",
    "requests>=2.32",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]
demo = [
    "streamlit>=1.44",
    "plotly>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobility"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "torch-cpu" }]
